<html>
<head>
    <title>Rec Room revivals player count</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #revivalPlayerCounts {
            margin-bottom: 20px;
            flex: 20%;
        }
        #chartContainer {
            width: 80vw;
            height: 80vh;
            flex: 80%;
        }
        #stuff {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <h1>Rec Room revivals player count</h1>
    Website by cart1416     <a href="https://github.com/Cart1416/RRPlayerCounts">GitHub</a>
    <div id="rangeControls" style="margin: 12px 0;">
        <label for="rangeSelect">Time range: </label>
        <select id="rangeSelect"></select>
    </div>
    <div id="stuff">
    <div id="revivalPlayerCounts"></div>
    <div id="chartContainer">
        <canvas id="myChart" width="400" height="200"></canvas>
    </div>
    </div>
    <script>
        const ctx = document.getElementById('myChart');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Loading'],
                datasets: [{
                    label: 'Players Online',
                    data: [0],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    },
                    x: {
                        ticks: {
                            maxTicksLimit: 10
                        }
                    }
                },
                plugins: {
                    zoom: {
                        zoom: {
                        wheel: {
                            enabled: true,
                        },
                        pinch: {
                            enabled: true
                        },
                        mode: 'x',
                        }
                    }
                }
            }
        });

        function formatTimestamp(timestamp) {
            return new Date(timestamp * 1000).toLocaleString();
        }

        
        var refreshRate = 300000;
        var refreshTimer = null;
        
        const optionsForTime = {
            '24h': 24 * 60 * 60,
            '48h': 48 * 60 * 60,
            '72h': 72 * 60 * 60,
            '7d': 7 * 24 * 60 * 60,
            '30d': 30 * 24 * 60 * 60,
            '1y': 365 * 24 * 60 * 60,
            'all': null
        };
        var selectedRange = 'all';

        const rangeSelect = document.getElementById('rangeSelect');

        const rangeLabels = {
            '24h': '24 hours',
            '48h': '48 hours',
            '72h': '72 hours',
            '7d': '7 days',
            '30d': '30 days',
            '1y': '1 year',
            'all': 'Infinite'
        };

        for (var value of Object.keys(optionsForTime)) {
            const seconds = optionsForTime[value];
            const option = document.createElement('option');
            option.value = value;
            option.textContent = rangeLabels[value];
            rangeSelect.appendChild(option);
        }

        rangeSelect.value = selectedRange;

        rangeSelect.addEventListener('change', () => {
            selectedRange = rangeSelect.value;
            init();
        });

        function getFilteredTimestamps(allTimestamps) {
            if (!allTimestamps.length) {
                return [];
            }

            const latestTimestamp = Math.max(...allTimestamps);
            const rangeSeconds = optionsForTime[selectedRange];

            if (rangeSeconds === null) {
                return allTimestamps;
            }

            const cutoff = latestTimestamp - rangeSeconds;
            return allTimestamps.filter((timestamp) => timestamp >= cutoff);
        }

        async function getConfig() {
            const url = "/config";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
                }

                const result = await response.json();
                refreshRate = Number(result.interval ?? 300) * 1000;
                return result;
            } catch (error) {
                alert(error.message);
            }
        }

        async function getPlayerCountHistoryOfServer(name) {
            const url = `/data/${name}.json`;
            try {
                const response = await fetch(url);
                if (!response.ok) {
                throw new Error(`Response status: ${response.status}`);
                }

                const result = await response.json();
                return result;
            } catch (error) {
                alert(error.message);
            }
        }

        async function init() {
            const config = await getConfig();
            if (!config || !config.servers) {
                return;
            }

            if (refreshTimer) {
                clearInterval(refreshTimer);
            }
            refreshTimer = setInterval(init, refreshRate);

            const servers = config.servers;
            const serverHistoryByName = new Map();
            var revivalPlayerCountsDiv = document.getElementById('revivalPlayerCounts');

            revivalPlayerCountsDiv.innerHTML = '';

            for (const name of Object.keys(servers)) {
                const playerCountData = await getPlayerCountHistoryOfServer(name);
                if (!playerCountData || !playerCountData.length) {
                    continue;
                }

                const playerCount = playerCountData[playerCountData.length - 1].data.value;
                const serverDiv = document.createElement('div');
                const br = document.createElement('br');

                serverHistoryByName.set(name, playerCountData);
                serverDiv.textContent = `${name}: ${playerCount}`;
                revivalPlayerCountsDiv.appendChild(serverDiv);
                revivalPlayerCountsDiv.appendChild(br);
            }

            if (serverHistoryByName.size === 0) {
                chart.data.labels = ['No data'];
                chart.data.datasets = [{
                    label: 'Players Online',
                    data: [0],
                    borderWidth: 1,
                    fill: false
                }];
                chart.update();
                return;
            }

            const allTimestamps = [...new Set(
                [...serverHistoryByName.values()].flatMap((history) =>
                    history.map((entry) => Number(entry.timestamp))
                )
            )].sort((a, b) => a - b);

            const filteredTimestamps = getFilteredTimestamps(allTimestamps);
            const labels = filteredTimestamps.map((timestamp) => formatTimestamp(timestamp));

            chart.data.labels = labels;
            chart.data.datasets = [...serverHistoryByName.entries()].map(([name, history]) => {
                const dataByTimestamp = new Map(
                    history.map((entry) => [Number(entry.timestamp), Number(entry.data?.value ?? 0)])
                );

                return {
                    label: name,
                    data: filteredTimestamps.map((timestamp) => dataByTimestamp.get(timestamp) ?? null),
                    borderWidth: 1,
                    fill: false
                };
            });

            chart.update();
        }

        init();
    </script>
</body>
</html>
